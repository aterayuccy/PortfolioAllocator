spring.application.name=demo
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio_allocator}
spring.datasource.username=${DB_USERNAME:portfolio}
spring.datasource.password=${DB_PASSWORD:portfolio}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.separator=^^^
server.port=${PORT:1010}
server.forward-headers-strategy=framework
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:market-lens-development-secret-change-before-production-2026}
