spring.application.name=demo
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/market-lens}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
server.port=1010
app.jwt.secret=${JWT_SECRET:market-lens-development-secret-change-before-production-2026}
