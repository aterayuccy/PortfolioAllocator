name: Keep Render awake

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check production health
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 https://portfolioallocator.onrender.com/api/health
